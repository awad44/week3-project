openapi: 3.0.3
info:
  title: NERUOS Task Management API
  version: 1.0.0 (v1)
  description: "\n    REST API built with Django REST Framework and PostgreSQL.\n\n
    \   Features:\n    - JWT authentication with refresh-token rotation\n    - Role-Based
    Access Control (Viewer, Editor, Manager)\n    - Organization / tenant isolation\n
    \   - Task ownership and object-level permissions\n    - Pagination, filtering,
    searching and ordering\n    - Input validation and structured error responses\n
    \   - API throttling and idempotent task creation\n\n    Access rules:\n    -
    Viewer: Read tasks in their organization.\n    - Editor: Create tasks and update
    their own pending tasks.\n    - Manager: Create, update and delete tasks in their
    organization.\n\n    All task endpoints require authentication.\n    "
paths:
  /api/v1/projects/:
    get:
      operationId: v1_projects_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: v1_projects_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/:
