      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/:
    get:
      operationId: v1_tasks_list
      description: Return paginated tasks belonging to the authenticated user's organization.
        Supports filtering, searching and ordering.
      summary: List tasks
      parameters:
      - in: query
        name: completed
        schema:
          type: boolean
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: title_contains
        schema:
          type: string
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
    post:
      operationId: v1_tasks_create
      description: Create a task in the authenticated user's organization. The server
        automatically assigns the owner and organization. Requires task creation permission.
        An optional Idempotency-Key prevents duplicate creation when the same logical
        request is retried. The same key with different data returns HTTP 409.
      summary: Create a task
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique key of 8 to 128 characters. Reuse it when retrying the
          same task creation.
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}/:
    get:
      operationId: v1_tasks_retrieve
      description: Retrieve one task from the user's organization. A task outside
        that organization is not visible.
      summary: Retrieve a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    put:
      operationId: v1_tasks_update
      description: Update a task using PUT. Editors may modify their own pending tasks.
        Managers may modify tasks in their organization.
      summary: Replace a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: v1_tasks_partial_update
      description: Update selected task fields using PATCH. Editors may modify only
        their own pending tasks. Managers may modify any task in their organization.
      summary: Partially update a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: v1_tasks_destroy
      description: Delete a task in the user's organization. Requires the TaskManager
        role or equivalent delete_task permission.
      summary: Delete a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
