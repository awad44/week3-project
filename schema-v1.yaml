components:
  schemas:
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PaginatedTaskList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    PatchedProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        created_by_id:
          type: integer
          readOnly: true
        created_by_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_username:
          type: string
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        project:
          type: integer
        project_name:
          type: string
          readOnly: true
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        created_by_id:
          type: integer
          readOnly: true
        created_by_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_id
      - created_by_username
      - id
      - name
      - organization_id
      - organization_name
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_username:
          type: string
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        project:
          type: integer
        project_name:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - organization_id
      - organization_name
